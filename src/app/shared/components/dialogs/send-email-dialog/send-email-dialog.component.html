@if (formGroup) {
  <div class="dialog-container">
    <div class="dialog-header">
      <app-icon-button class="delete-button" (buttonClick)="close()"></app-icon-button>
    </div>

    <div class="dialog-content">
      <mat-dialog-content>
        <div class="d-flex flex-column gap-2">
          <div class="d-flex align-items-center gap-2">
            <mat-icon>{{ icon }}</mat-icon>
            <span>{{ data.title || 'Are you sure?' }}</span>
          </div>
          <p>
            {{ data.message || 'Please confirm that you want to continue with this action.' }}
          </p>
        </div>
        <div class="d-flex flex-column gap-2">
          <app-text-area
            [isRequired]="true"
            [label]="'Subject'"
            [formGroup]="formGroup"
            [max]="60"
            [controlName]="'subject'"
          >
          </app-text-area>
          <app-text-input
            [isRequired]="true"
            [label]="'Recipient email address'"
            type="Email"
            placeholder="alex.morgan.client@gmail.com"
            [formGroup]="formGroup"
            [controlName]="'recipient'"
          >
          </app-text-input>
        </div>
      </mat-dialog-content>

      <mat-dialog-actions align="end" class="dialog-actions gap-2">
        <app-primary-button
          [buttonName]="data.cancelText || 'Cancel'"
          (buttonClick)="close()"
        ></app-primary-button>
        <app-primary-button
          [buttonName]="data.confirmText || 'Confirm'"
          (buttonClick)="onConfirm()"
        ></app-primary-button>
      </mat-dialog-actions>
    </div>
  </div>
  @if (validationErrors) {
    <app-validation [validationMessages]="validationErrors" [myGroup]="formGroup"></app-validation>
  }
}
