<div
  class="dialog-container"
  [class.danger]="data.variant === 'danger'"
  [class.success]="data.variant === 'success'"
>
  <div class="dialog-header">
    <app-icon-button
      matTooltip="close"
      class="delete-button"
      (buttonClick)="close(this.dialogResult.cancel)"
    ></app-icon-button>
  </div>
  <div class="dialog-content">
    <mat-dialog-content>
      <div class="d-flex align-items-center gap-2">
        <div>
          <mat-icon color="warn">{{ icon }}</mat-icon>
        </div>
        <div>
          <h6 mat-dialog-title>{{ data.title || 'Are you sure?' }}</h6>
        </div>
      </div>
      <p>
        {{ data.message }}
      </p>
    </mat-dialog-content>

    <mat-dialog-actions align="end" class="d-flex align-items-center gap-1">
      <button
        mat-stroked-button
        class="dialog-btn dialog-cancel"
        (click)="close(this.dialogResult.cancel)"
      >
        {{ data.cancelText || 'Cancel' }}
      </button>
      @if (data.hasDiscard) {
        <app-primary-button
          (click)="close(this.dialogResult.discard)"
          buttonName="Discard"
          color="warn"
        ></app-primary-button>
      }
      <app-primary-button
        (click)="close(this.dialogResult.save)"
        [buttonName]="data.confirmText || 'Confirm'"
      ></app-primary-button>
    </mat-dialog-actions>
  </div>
</div>
