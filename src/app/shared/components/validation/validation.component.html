<div
  style="background-color: #ebebeb"
  class="validation-panel position-fixed border-1 border-gray border bottom-0 end-0 p-2"
  [class.minimized]="isMinimized"
>
  <div class="d-flex justify-content-between align-items-center">
    <h6 class="m-0">Validation Issues</h6>
    @if (isMinimized) {
      <h6 class="m-0 mx-1 text-danger">{{ validationMessages?.length }} errors</h6>
    }

    <div class="d-flex align-items-center gap-1">
      <button matMiniFab (click)="toggleMinimize()">
        <mat-icon>
          {{ isMinimized ? 'open_in_full' : 'minimize' }}
        </mat-icon>
      </button>
    </div>
  </div>

  @if (!isMinimized) {
    <ol class="text-danger mt-2 mb-0">
      @for (item of validationMessages; track $index) {
        <li class="validation-item" (click)="focus(item)">
          <a class="text-danger mb-1">{{ item.message }}</a>
        </li>
      }
    </ol>
  }
</div>
