<div
  class="w-100 bg-white sticky-top p-2 h-auto border-1 border-bottom d-flex align-items-center justify-content-between align-items-center"
>
  <h4>{{ title }}</h4>
  <div class="d-flex align-items-center gap-2">
    @for (action of pageActionService.actions(); track action.id) {
      <button
        matButton="outlined"
        [disabled]="loading$ | async"
        (click)="pageActionService.runAction(action.id)"
      >
        {{ action.text }}
      </button>
    }
    <app-user-menu></app-user-menu>
  </div>
</div>
