<div class="builder-page">
  @if (this.loading$ | async) {
    <app-loading-overlay
      [visible]="this.loading$.value"
      [title]="'Loading...'"
      [message]="'Please wait while load all datas'"
    >
    </app-loading-overlay>
  } @else {
    @if (forms && forms.length > 0) {
      <div class="forms-grid">
        @for (item of forms; track item.id ?? $index) {
          <mat-card class="form-card" appearance="outlined" (click)="onPreviewClick(item)">
            <div class="form-card-top">
              <div class="form-card-icon">
                <mat-icon>description</mat-icon>
              </div>

              <div class="form-card-meta">
                <span class="form-badge">Dynamic form</span>
                <h3>{{ item.formName }}</h3>
                <p>Form fields: {{ item.fields.length }}</p>
              </div>
            </div>

            <div class="form-card-body">
              <div class="form-info-row">
                <span class="info-label">Status</span>
                <span class="info-value success">Ready</span>
              </div>

              <div class="form-info-row">
                <span class="info-label">Type</span>
                <span class="info-value">Form template</span>
              </div>
            </div>

            <mat-card-actions class="d-flex flex-column gap-3">
              <button
                mat-stroked-button
                class="card-btn card-btn-ghost"
                (click)="$event.stopPropagation(); createSubmission(item)"
              >
                Create Submission
              </button>
              <div class="d-flex align-items-center justify-content-between w-100 gap-1">
                <div class="d-flex align-items-center gap-2">
                  <app-icon-button
                    iconName="content_copy"
                    class="success-button"
                  ></app-icon-button>
                  <app-icon-button
                    iconName="visibility"
                    class="success-button"
                    (buttonClick)="onPreviewClick(item)"
                  ></app-icon-button>
                  <app-icon-button
                    iconName="edit"
                    class="success-button"
                    (buttonClick)="editFlow(item)"
                  >
                  </app-icon-button>
                </div>
                <app-icon-button
                  iconName="delete"
                  class="delete-button"
                  (buttonClick)="deleteFormitem(item.id ?? '')"
                ></app-icon-button>
              </div>
            </mat-card-actions>
          </mat-card>
        }
      </div>
    } @else {
      <app-empty-state
        [kicker]="'Form library'"
        [title]="'No forms created yet'"
        [description]="
          'You have not created any dynamic forms yet. Start by building your first form template and manage it from here.'
        "
        [buttonText]="'Create your first form'"
        [imageSrc]="'Documents-pana.svg'"
        (action)="goToCreateForm()"
      ></app-empty-state>
    }
  }
</div>
