@if (formGroup) {
  <div class="auth-page">
    <div class="auth-card">
      <a routerLink="/login" class="back-link">← Back to login</a>
      <div class="auth-header">
        <div class="brand-badge">S</div>
        <h2>Reset your password</h2>
        <p>Enter your email address and we will send you a secure link to reset your password.</p>
      </div>
      <form class="auth-form" [formGroup]="formGroup" (ngSubmit)="resetPassword()">
        <app-text-input
          controlName="password"
          label="New password"
          [isRequired]="true"
          placeholder="••••••••"
          type="Password"
          [formGroup]="formGroup"
        >
        </app-text-input>
        <app-text-input
          controlName="passwordConfirm"
          label="Confirm password"
          [isRequired]="true"
          placeholder="••••••••"
          type="Password"
          [formGroup]="formGroup"
        >
        </app-text-input>
        <button type="submit" class="btn btn-primary w-100">Reset password</button>
      </form>

      <div class="auth-footer">
        <span>Remember your password?</span>
        <a routerLink="/login">Back to login</a>
      </div>
    </div>
  </div>
}
@if (validationErrors && validationErrors.length > 0) {
  <app-validation [validationMessages]="validationErrors" [myGroup]="formGroup"></app-validation>
}
