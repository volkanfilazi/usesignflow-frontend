@if (formGroup) {
  <main class="auth-page">
    <article class="auth-card">
      <a routerLink="/login" class="back-link">← Back to login</a>
      <header class="auth-header">
        <div class="brand-badge">S</div>
        <h1>Reset your password</h1>
        <p>Enter your email address and we will send you a secure link to reset your password.</p>
      </header>
      <form class="d-flex flex-column gap-3" [formGroup]="formGroup" (ngSubmit)="resetPassword()">
        <app-text-input
          controlName="password"
          label="New password"
          [isRequired]="true"
          placeholder="••••••••"
          type="Password"
          [formGroup]="formGroup"
        >
        </app-text-input>
        <app-text-input
          controlName="passwordConfirm"
          label="Confirm password"
          [isRequired]="true"
          placeholder="••••••••"
          type="Password"
          [formGroup]="formGroup"
        >
        </app-text-input>
        <app-secondary-button
          buttonName="Reset Password"
          textUntilEventOver="Resetting password..."
          [disabled]="loading$.value"
        ></app-secondary-button>
      </form>

      <footer class="auth-footer">
        <span>Remember your password?</span>
        <a routerLink="/login">Back to login</a>
      </footer>
    </article>
  </main>
}
@if (validationErrors && validationErrors.length > 0) {
  <app-validation [validationMessages]="validationErrors" [myGroup]="formGroup"></app-validation>
}
