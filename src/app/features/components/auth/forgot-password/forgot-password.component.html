@if (formGroup) {
  <main class="auth-page">
    <article class="auth-card">
      <a routerLink="/login" class="back-link"> ← Back to login </a>

      <header class="auth-header">
        <div class="brand-badge" aria-hidden="true">S</div>

        <h1>Reset your password</h1>

        <p>Enter your email address and we will send you a secure link to reset your password.</p>
      </header>

      <form class="auth-form" [formGroup]="formGroup" (ngSubmit)="sendResetLink()">
        <app-text-input
          controlName="email"
          [formGroup]="formGroup"
          type="Email"
          placeholder="name@email.com"
        ></app-text-input>

        <app-secondary-button
          [disabled]="loading$.value"
          buttonName="Send reset link"
          textUntilEventOver="Sending reset link..."
        ></app-secondary-button>
      </form>

      <footer class="auth-footer">
        <span>Remember your password?</span>
        <a routerLink="/login">Back to login</a>
      </footer>
    </article>
  </main>
}
@if (validationErrors && validationErrors.length > 0) {
  <app-validation [validationMessages]="validationErrors" [myGroup]="formGroup"></app-validation>
}
