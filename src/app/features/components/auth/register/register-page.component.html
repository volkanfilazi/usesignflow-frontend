<main class="auth-page">
  <article class="auth-card">
    @if (this.loading$ | async) {
      <app-loading-overlay
        [visible]="this.loading$.value"
        [title]="'Signup you in...'"
        [message]="'Please wait while we securely log you into your account.'"
      >
      </app-loading-overlay>
    }
    <a routerLink="/" class="back-link">← Back to home</a>

    <header class="auth-header">
      <div class="brand-badge">F</div>
      <h1>Create your account</h1>
      <p>Start building and sending digital contracts in minutes.</p>
    </header>

    @if (formGroup) {
      <form class="d-flex flex-column gap-3" [formGroup]="formGroup">
        <app-text-input
          [isRequired]="true"
          [label]="'Fullname'"
          [formGroup]="formGroup"
          [controlName]="'fullName'"
          type="Text"
          placeholder="John Doe"
        >
        </app-text-input>
        <app-text-input
          [isRequired]="true"
          [label]="'Email'"
          [formGroup]="formGroup"
          [controlName]="'email'"
          type="Email"
          placeholder="name@email.com"
        >
        </app-text-input>
        <app-text-input
          [isRequired]="true"
          [label]="'Password'"
          [formGroup]="formGroup"
          [controlName]="'password'"
          type="Password"
          placeholder="••••••••"
        >
        </app-text-input>
        <app-text-input
          [isRequired]="true"
          [label]="'Password Confirm'"
          [formGroup]="formGroup"
          [controlName]="'passwordConfirm'"
          type="Password"
          placeholder="••••••••"
        >
        </app-text-input>
        <div class="d-flex align-items-center mt-3 gap-2">
          <span class="terms-link" (click)="openTerms()">Terms of Service</span>
          <span> | </span>
          <span class="terms-link" (click)="openPrivacy()">Privacy Policy</span>
        </div>
        <div class="d-flex align-items-center">
          <span>I agree to the</span>
          <app-checkbox
            [formGroup]="formGroup"
            controlName="termsAccepted"
            checkboxName="Terms of Service"
          ></app-checkbox>
          <app-checkbox
            [formGroup]="formGroup"
            controlName="privacyAccepted"
            checkboxName="Privacy Policy"
          ></app-checkbox>
        </div>

        <app-secondary-button
          (buttonClick)="register()"
          buttonName="Create Account"
          [disabled]="loading$.value"
          textUntilEventOver="Creating..."
        ></app-secondary-button>
      </form>
    } @else {
      <div class="w-100 d-flex align-items-center justify-content-center">
        <app-spinner [diameter]="50"></app-spinner>
      </div>
    }

    <div class="auth-divider">
      <span>or</span>
    </div>

    <footer class="auth-footer">
      <span>Already have an account?</span>
      <a routerLink="/login">Login</a>
    </footer>
  </article>
</main>

@if (validationErrors && validationErrors.length > 0) {
  <app-validation [validationMessages]="validationErrors" [myGroup]="formGroup"></app-validation>
}
