<div class="auth-page">
  <div class="auth-card">
    <a routerLink="/" class="back-link">← Back to home</a>
    <div class="auth-header">
      <div class="brand-badge">F</div>
      <h2>Welcome back</h2>
      <p>Sign in to continue to SignFlow</p>
    </div>

    @if (formGroup) {
      <form [formGroup]="formGroup" (ngSubmit)="login()">
        <div class="form-group">
          <label>Email</label>
          <input
            id="email"
            formControlName="email"
            [class.invalid]="isInvalid('email')"
            type="email"
            placeholder="name@email.com"
          />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            id="password"
            formControlName="password"
            [class.invalid]="isInvalid('password')"
            type="password"
            placeholder="••••••••"
          />
        </div>

        <button
          class="btn btn-primary w-100 submit-btn"
          type="submit"
          [disabled]="this.loading$ | async"
        >
          @if (!(this.loading$ | async)) {
            <span class="btn-content">Login</span>
          }

          @if (this.loading$.value) {
            <span class="btn-loading">
              <span class="btn-spinner"></span>
              <span>Signing in...</span>
            </span>
          }
        </button>
      </form>
    }

    <div class="auth-footer">
      <div class="auth-footer-top">
        <span>Don't have an account?</span>
        <a routerLink="/register">Register</a>
      </div>

      <div class="auth-divider">
        <span>or continue with</span>
      </div>

      <div class="google-button-shell">
        <div #googleButton id="googleButton" class="google-button-host"></div>
      </div>

      <div class="auth-footer-bottom">
        <span>Did you forget your password?</span>
        <a routerLink="/forgot-password">Forgot password</a>
      </div>
    </div>
  </div>
</div>
@if (validationErrors && validationErrors.length > 0) {
  <app-validation [validationMessages]="validationErrors" [myGroup]="formGroup"></app-validation>
}
