<div class="auth-page">
  <div class="auth-card">
    @if (this.loading$ | async) {
      <app-loading-overlay
        [visible]="this.loading$.value"
        [title]="'Signing you in...'"
        [message]="'Please wait while we securely log you into your account.'"
      >
      </app-loading-overlay>
    }

    <div class="auth-header">
      <div class="brand-badge">F</div>
      <h2>Welcome back</h2>
      <p>Sign in to continue to FormFlow</p>
    </div>

    @if (formGroup) {
      <form [formGroup]="formGroup" (ngSubmit)="login()">
        <div class="form-group">
          <label>Email</label>
          <input
            id="email"
            formControlName="email"
            [class.invalid]="isInvalid('email')"
            type="email"
            placeholder="name@email.com"
          />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            id="password"
            formControlName="password"
            [class.invalid]="isInvalid('password')"
            type="password"
            placeholder="••••••••"
          />
        </div>

        <button
          class="btn btn-primary w-100 submit-btn"
          type="submit"
          [disabled]="this.loading$ | async"
        >
          @if (!(this.loading$ | async)) {
            <span class="btn-content">Login</span>
          }

          @if (this.loading$.value) {
            <span class="btn-loading">
              <span class="btn-spinner"></span>
              <span>Signing in...</span>
            </span>
          }
        </button>
      </form>
    } @else {
      <div class="w-100 d-flex align-items-center justify-content-center">
        <app-spinner [diameter]="50"></app-spinner>
      </div>
    }

    <div class="auth-footer">
      <span>Don't have an account?</span>
      <a routerLink="/register">Register</a>
    </div>
  </div>
</div>
