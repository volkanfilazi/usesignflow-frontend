@if (!isDesktop) {
  <div class="position-fixed top-0 end-0 m-3 z-3">
    <button mat-icon-button (click)="isMobile = !isMobile">
      <mat-icon>{{ isMobile ? 'close' : 'menu' }}</mat-icon>
    </button>
  </div>
}
<mat-sidenav-container class="layout h-100">
  <mat-sidenav
    [mode]="isDesktop ? 'side' : 'over'"
    [opened]="isDesktop || isMobile"
    [style.width]="isMobile ? '100vw' : '260px'"
  >
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/dashboard/form-generator"
        (click)="isMobile ? (isMobile = !isMobile) : null"
        routerLinkActive="selected"
      >
        Generate new form
      </a>

      <a
        mat-list-item
        routerLink="/dashboard/forms"
        (click)="isMobile ? (isMobile = !isMobile) : null"
        routerLinkActive="selected"
      >
        Generic form list
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="px-3">
    <app-header></app-header>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
