@if (!isDesktop) {
  <div class="mobile-menu-trigger">
    <button class="mobile-menu-btn" mat-icon-button (click)="isMobile = !isMobile">
      <mat-icon>{{ isMobile ? 'close' : 'menu' }}</mat-icon>
    </button>
  </div>
}

<mat-sidenav-container class="dashboard-layout">
  <mat-sidenav
    class="dashboard-sidenav"
    [mode]="isDesktop ? 'side' : 'over'"
    [opened]="isDesktop || isMobile"
    [style.width]="isMobile ? '100vw' : '280px'"
  >
    <div class="sidenav-shell">
      <div class="sidenav-brand">
        <div class="brand-icon">
          <img src="signflow-logo.svg" alt="SignFlow logo" />
        </div>

        <div class="brand-text">
          <h2>SignFlow</h2>
          <span>Dashboard</span>
        </div>
      </div>

      <div class="sidenav-section">
        <span class="sidenav-section-title">Workspace</span>

        <mat-nav-list class="sidenav-nav">
          <a
            mat-list-item
            class="sidenav-link"
            routerLink="/dashboard/form-generator"
            (click)="isMobile ? (isMobile = !isMobile) : null"
            routerLinkActive="selected"
          >
            <div class="d-flex align-items-center gap-1">
              <mat-icon>edit_note</mat-icon>
              <span>New Flow</span>
            </div>
          </a>

          <a
            mat-list-item
            class="sidenav-link"
            routerLink="/dashboard/forms"
            (click)="isMobile ? (isMobile = !isMobile) : null"
            routerLinkActive="selected"
          >
            <div class="d-flex align-items-center gap-1">
              <mat-icon>description</mat-icon>
              <span>My Flows</span>
            </div>
          </a>

          <a
            mat-list-item
            class="sidenav-link"
            routerLink="/dashboard/submissions"
            (click)="isMobile ? (isMobile = !isMobile) : null"
            routerLinkActive="selected"
          >
            <div class="d-flex align-items-center gap-1">
              <mat-icon>description</mat-icon>
              <span>Submissions</span>
            </div>
          </a>
        </mat-nav-list>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="dashboard-content">
    <app-header></app-header>
    <div class="dashboard-router-shell">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
