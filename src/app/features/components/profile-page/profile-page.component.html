<div class="profile-page">
  <section class="profile-hero-card">
    <div class="profile-hero-left">
      <div class="profile-avatar">{{ fullName | initials }}</div>
      <div class="profile-hero-content">
        <div class="profile-badge-row">
          @if (isVerified) {
            <span class="profile-badge verified">Verified account</span>
          } @else {
            <span class="profile-badge not-verified">Not verified</span>
          }
        </div>
        <h1>{{ fullName }}</h1>
        <p class="profile-email">{{ email }}</p>
        <p class="profile-subtitle">
          Manage your personal account details, track your activity, and keep your workspace up to
          date.
        </p>
      </div>
    </div>
  </section>
</div>
